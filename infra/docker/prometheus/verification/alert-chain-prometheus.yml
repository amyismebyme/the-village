global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert-chain.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - village-alertmanager:9093

scrape_configs:
  - job_name: village-alert-chain-test
    metrics_path: /metrics
    static_configs:
      - targets:
          - alert-chain-exporter:9101
