global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - recording_rules.yml
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - village-alertmanager:9093

scrape_configs:
  - job_name: village-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - village-api:8080
