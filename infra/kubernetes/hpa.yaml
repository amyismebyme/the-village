apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: village-api
  namespace: village
  labels:
    app.kubernetes.io/name: village-api
    app.kubernetes.io/part-of: the-village
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: village-api
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
