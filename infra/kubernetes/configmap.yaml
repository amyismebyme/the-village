apiVersion: v1
kind: ConfigMap
metadata:
  name: village-api-config
  namespace: village
data:
  PORT: "8080"
  ENVIRONMENT: "development"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  READ_TIMEOUT: "10"
  REQUEST_TIMEOUT: "35"
  WRITE_TIMEOUT: "40"
  IDLE_TIMEOUT: "60"
  SHUTDOWN_TIMEOUT: "15"

  DB_HOST: "village-postgres"
  DB_PORT: "5432"
  DB_NAME: "village"
  DB_USER: "village"
  DB_SSLMODE: "disable"
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "1"
  DB_MAX_CONN_LIFETIME: "3600"
  DB_MAX_CONN_IDLE_TIME: "300"
  DB_HEALTH_CHECK_PERIOD: "60"
  DB_QUERY_TIMEOUT: "30"

  CACHE_ENABLED: "true"
  CACHE_MAX_ENTRIES: "1000"
  CACHE_REDDIT_LISTING_TTL: "120"
  CACHE_COMMUNITY_TTL: "300"

  WORKER_ENABLED: "false"
  REDDIT_ENABLED: "false"

  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "village-api"
  OTEL_SERVICE_VERSION: "0.1.2"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1"
  OTEL_ENVIRONMENT: "development"
