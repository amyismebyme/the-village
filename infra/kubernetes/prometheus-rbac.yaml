apiVersion: v1
kind: ServiceAccount
metadata:
  name: village-k8s-prometheus
  namespace: village
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: village-k8s-prometheus
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - namespaces
      - pods
      - services
      - endpoints
      - endpointslices
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: village-k8s-prometheus
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: village-k8s-prometheus
subjects:
  - kind: ServiceAccount
    name: village-k8s-prometheus
    namespace: village
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: village-kube-state-metrics
  namespace: village
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: village-kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
rules:
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - apps
