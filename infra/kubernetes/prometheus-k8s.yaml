apiVersion: v1
kind: ConfigMap
metadata:
  name: village-k8s-prometheus-config
  namespace: village
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    external_labels:
      cluster: docker-desktop
      environment: kubernetes

    scrape_configs:
      - job_name: village-api
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - village
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: village-api
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - action: replace
            source_labels:
              - __address__
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: ([^:]+)(?::\\d+)?;(\\d+)
            replacement: $1:$2
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - village-kube-state-metrics.village.svc.cluster.local:8080

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - village
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            regex: node-exporter
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: node

      - job_name: kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: replace
            source_labels:
              - __address__
            target_label: __address__
            replacement: kubernetes.default.svc:443
          - action: replace
            source_labels:
              - __meta_kubernetes_node_name
            target_label: node
          - action: replace
            source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: kubelet-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: replace
            source_labels:
              - __address__
            target_label: __address__
            replacement: kubernetes.default.svc:443
          - action: replace
            source_labels:
              - __meta_kubernetes_node_name
            target_label: node
          - action: replace
            source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
---
apiVersion: v1
kind: Service
metadata:
  name: village-k8s-prometheus
  namespace: village
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: village-k8s-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: village-k8s-prometheus
  namespace: village
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: village-k8s-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: village-k8s-prometheus
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: the-village
    spec:
      serviceAccountName: village-k8s-prometheus
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: village-k8s-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: village-k8s-prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: village-k8s-prometheus-data
  namespace: village
  labels:
    app.kubernetes.io/name: village-k8s-prometheus
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: the-village
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
