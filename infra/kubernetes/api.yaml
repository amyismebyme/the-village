apiVersion: v1
kind: ServiceAccount
metadata:
  name: village-api
  namespace: village
  labels:
    app.kubernetes.io/name: village-api
    app.kubernetes.io/part-of: the-village
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: village-api
  namespace: village
  labels:
    app.kubernetes.io/name: village-api
    app.kubernetes.io/part-of: the-village
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: village-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: village-api
        app.kubernetes.io/part-of: the-village
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: village-api
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: village-api
      containers:
        - name: api
          image: village-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: village-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: village-postgres-secret
                  key: POSTGRES_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: village-api
  namespace: village
  labels:
    app.kubernetes.io/name: village-api
    app.kubernetes.io/part-of: the-village
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: village-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
