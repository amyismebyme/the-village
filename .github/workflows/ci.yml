name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test, Vet & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true

      - name: Verify formatting
        run: make fmt-check

      - name: Download dependencies
        run: |
          cd apps/api
          go mod download

      - name: Run tests
        run: make test

      - name: Run race detector
        run: make test-race

      - name: Run vet
        run: make vet

      - name: Run linter
        run: make lint

      - name: Build
        run: make build