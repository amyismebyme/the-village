name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Build and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Verify build metadata injection
        shell: bash
        env:
          EXPECTED_BUILD_VERSION: ${{ github.sha }}
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
          EXPECTED_ENVIRONMENT: production
        run: |
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          EXPECTED_BUILD_TIMESTAMP="$BUILD_TIME" \
          go test ./internal/runtime \
            -run '^TestInjectedBuildMetadata$' \
            -count=1 \
            -ldflags "\
              -X github.com/amyismebyme/the-village/apps/api/internal/runtime.BuildVersion=${EXPECTED_BUILD_VERSION} \
              -X github.com/amyismebyme/the-village/apps/api/internal/runtime.GitCommit=${EXPECTED_GIT_COMMIT} \
              -X github.com/amyismebyme/the-village/apps/api/internal/runtime.BuildTimestamp=${BUILD_TIME} \
              -X github.com/amyismebyme/the-village/apps/api/internal/runtime.Environment=${EXPECTED_ENVIRONMENT}"   

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"

          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9.0
          working-directory: apps/api

      - name: Unit tests
        run: go test ./...

      - name: Integration tests
        working-directory: .
        run: make test-integration

      - name: Race tests
        run: go test -race ./...

      - name: Build
        run: go build ./...
