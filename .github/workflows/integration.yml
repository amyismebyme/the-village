name: Integration Tests

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: village
          POSTGRES_USER: village
          POSTGRES_PASSWORD: village

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U village -d village"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: village
          DB_PASSWORD: village
          DB_NAME: village
          DB_SSLMODE: disable
        run: |
          go test \
            -tags=integration \
            ./internal/integration/... \
            -v \
            -count=1