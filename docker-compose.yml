
services:
  village-api:
    build: .

    ports:
      - "8080:8080"

    environment:
      PORT: 8080
      ENVIRONMENT: development
      LOG_LEVEL: info

    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus

    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - village-api

  grafana:
    image: grafana/grafana

    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

  postgres:
    image: postgres:17

    container_name: village-postgres

    environment:
      POSTGRES_DB: village
      POSTGRES_USER: village
      POSTGRES_PASSWORD: village

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres-data: